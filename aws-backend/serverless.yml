# Serverless Framework config for NHAI FaceAuth attendance sync backend.
# Deploy with:  npm i -g serverless && serverless deploy
#
# Produces a public HTTPS endpoint (POST /attendance) backed by a Lambda
# that writes to DynamoDB. Copy the printed endpoint URL into the mobile
# app's SyncService.ts -> AWS_ENDPOINT.

service: nhai-faceauth-sync

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: ap-south-1            # Mumbai — closest to NHAI field operations
  stage: prod
  environment:
    TABLE_NAME: nhai_attendance
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:BatchWriteItem
          Resource:
            - !GetAtt AttendanceTable.Arn

functions:
  syncAttendance:
    handler: lambda_handler.handler
    timeout: 29
    memorySize: 256
    events:
      - http:
          path: attendance
          method: post
          cors: true

resources:
  Resources:
    AttendanceTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: nhai_attendance
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: employee_id
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: N
        KeySchema:
          - AttributeName: employee_id     # partition key
            KeyType: HASH
          - AttributeName: timestamp       # sort key (idempotency)
            KeyType: RANGE
